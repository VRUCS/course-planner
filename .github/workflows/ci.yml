name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: uv run ruff check .
      - run: npx eslint
      - run: uv run python -m pytest -q
      - run: uv run python -m tools.data_pipeline.course_converter --check
      - run: uv run python -m tools.data_pipeline.curriculum_pipeline check
      - run: npm test
      - run: uv run python -m compileall -q apps/api tools
      - name: Check JavaScript syntax
        run: find apps/web/scripts apps/web/generated apps/extension -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: uv run python tools/build_static.py
      - name: Ensure private/source directories are not deployed
        run: |
          test ! -e _site/data
          test ! -e _site/api
          test ! -e _site/data-editor.html
          test ! -e _site/scripts/pages/data-editor.js
          test -e _site/index.html
