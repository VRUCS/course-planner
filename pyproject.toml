[project]
name = "entekhab-vahed"
version = "0.1.0"
description = "A Persian-first university course planning tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ai-extract = [
    "openai>=1,<2",
    "pymupdf>=1.24,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.5,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["raw_data", "temp", "_site"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP modernization, B bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests use fixtures via arguments that look unused and long literal payloads.
"tests/*" = ["E501"]
# FastAPI's dependency injection uses Depends() in argument defaults.
"backend/*" = ["B008"]
# Persian prompt text reads worse when wrapped mid-sentence.
"ai_extract.py" = ["E501"]
