<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه انتخاب واحد هوشمند</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"/>
    <style>
        /* ===== VARIABLES ===== */
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-sidebar: #1e293b;
            --bg-input: #0f172a;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --primary: #60a5fa;
            --primary-dim: rgba(96,165,250,0.15);
            --accent: #1e3a8a;
            --danger: #f87171;
            --danger-dim: rgba(248,113,113,0.15);
            --warning: #fb923c;
            --warning-dim: rgba(251,146,60,0.15);
            --success: #34d399;
            --success-dim: rgba(52,211,153,0.15);
            --scroll-thumb: #475569;
            --shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        [data-theme="light"] {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-sidebar: #ffffff;
            --bg-input: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #2563eb;
            --primary-dim: rgba(37,99,235,0.1);
            --accent: #eff6ff;
            --danger: #dc2626;
            --danger-dim: rgba(220,38,38,0.1);
            --warning: #ea580c;
            --warning-dim: rgba(234,88,12,0.1);
            --success: #059669;
            --success-dim: rgba(5,150,105,0.1);
            --scroll-thumb: #cbd5e1;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        /* ===== RESET ===== */
        *, *::before, *::after { box-sizing: border-box; outline: none; margin: 0; padding: 0; }
        * { transition: background-color 0.2s, border-color 0.2s, color 0.1s; }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 3px; }

        /* ===== SIDEBAR ===== */
        aside {
            width: 380px;
            min-width: 380px;
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 20;
            box-shadow: var(--shadow);
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .sidebar-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .unit-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-dim);
            border: 1px solid var(--primary);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary);
            transition: all 0.3s;
        }
        .unit-badge.over-limit {
            background: var(--danger-dim);
            border-color: var(--danger);
            color: var(--danger);
        }

        /* Tab Bar */
        .tab-bar {
            display: flex;
            background: var(--bg-input);
            border-radius: 10px;
            padding: 3px;
            gap: 2px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: var(--bg-card);
            color: var(--primary);
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }

        /* ===== TAB CONTENTS ===== */
        .tab-content { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .tab-content.active { display: flex; }

        /* Search Tab */
        .filter-container { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
        .filter-row { display: flex; gap: 8px; }
        .filter-row select { flex: 1; }

        select, input[type="text"] {
            width: 100%; padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-input);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.875rem;
            appearance: none;
        }
        select:focus, input:focus { border-color: var(--primary); }
        .search-wrap { position: relative; }
        .search-icon { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; font-size: 0.9rem; }
        .search-wrap input { padding-right: 32px; }

        .course-list { flex: 1; overflow-y: auto; padding: 10px; }
        .list-header { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 8px; }
        .list-count { font-size: 0.8rem; color: var(--text-muted); }

        .course-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            position: relative;
            transition: all 0.15s;
        }
        .course-card:hover { border-color: var(--primary); transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .course-card.selected {
            background: var(--primary-dim);
            border-color: var(--primary);
            border-right: 3px solid var(--primary);
        }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 8px; }
        .card-name { font-size: 0.9rem; font-weight: 600; line-height: 1.4; flex: 1; }
        .badge { font-size: 0.68rem; padding: 2px 7px; border-radius: 20px; color: #fff; white-space: nowrap; flex-shrink: 0; }
        .badge.male { background: #3b82f6; }
        .badge.female { background: #ec4899; }
        .badge.mixed { background: #8b5cf6; }
        .card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); }
        .card-meta-left { display: flex; align-items: center; gap: 8px; }
        .card-units { font-size: 0.72rem; background: var(--border); border-radius: 4px; padding: 1px 6px; color: var(--text-muted); }
        .card-capacity { font-size: 0.72rem; color: var(--text-muted); }

        /* Curriculum Tab */
        .curriculum-controls { padding: 12px 16px; border-bottom: 1px solid var(--border); }
        .curriculum-controls label { font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 6px; }
        .curriculum-scroll { flex: 1; overflow-y: auto; padding: 12px 16px; }

        .semester-block { margin-bottom: 20px; }
        .semester-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .semester-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .curriculum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

        .cur-card {
            border-radius: 8px;
            padding: 9px 10px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-card);
            transition: all 0.15s;
            position: relative;
        }
        .cur-card:hover { transform: translateY(-1px); }
        .cur-card-name { font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
        .cur-card-meta { font-size: 0.68rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
        .cur-card-status {
            width: 10px; height: 10px; border-radius: 50%;
            flex-shrink: 0;
        }

        .cur-card.passed { background: var(--success-dim); border-color: var(--success); }
        .cur-card.passed .cur-card-name { color: var(--success); }
        .cur-card.passed .cur-card-status { background: var(--success); }

        .cur-card.failed { background: var(--danger-dim); border-color: var(--danger); }
        .cur-card.failed .cur-card-name { color: var(--danger); }
        .cur-card.failed .cur-card-status { background: var(--danger); }

        .cur-card.available { background: var(--primary-dim); border-color: var(--primary); }
        .cur-card.available .cur-card-name { color: var(--primary); }
        .cur-card.available .cur-card-status { background: var(--primary); }

        .cur-card.locked { opacity: 0.5; cursor: not-allowed; }
        .cur-card.locked .cur-card-status { background: var(--text-muted); }

        .cur-card.taking { background: rgba(250,204,21,0.15); border-color: #facc15; }
        .cur-card.taking .cur-card-name { color: #facc15; }
        .cur-card.taking .cur-card-status { background: #facc15; }

        .recommendations {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .rec-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 10px; color: var(--text-main); }
        .rec-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            margin-bottom: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.15s;
        }
        .rec-item:hover { border-color: var(--primary); background: var(--primary-dim); }
        .rec-item-units { font-size: 0.7rem; color: var(--text-muted); background: var(--border); border-radius: 4px; padding: 1px 6px; }

        /* ===== MAIN AREA ===== */
        main { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow: hidden; min-width: 0; }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .main-header-left { display: flex; align-items: center; gap: 12px; }
        .main-title { font-size: 1.25rem; font-weight: 700; }
        .selected-count-header {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px 10px;
        }

        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn {
            padding: 7px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn-exam { background: #f59e0b; color: #fff; }
        .btn-theme { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); }
        .btn-print { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); }
        .btn-prof { background: #6366f1; color: #fff; }

        /* ===== TIMETABLE ===== */
        .timetable-container {
            flex: 1;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 12px;
            overflow: auto;
        }
        .timetable {
            display: grid;
            grid-template-columns: 65px repeat(5, 1fr);
            grid-template-rows: 44px repeat(5, 1fr);
            gap: 3px;
            min-width: 680px;
            height: 100%;
            min-height: 350px;
        }
        .cell {
            background: var(--bg-body);
            display: flex; align-items: center; justify-content: center;
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .cell.header { background: var(--primary); color: #fff; font-weight: 700; font-size: 0.85rem; }
        .cell.time-label { font-size: 0.72rem; font-weight: 600; flex-direction: column; gap: 1px; }

        .slot {
            background: var(--bg-body);
            border: 1px dashed var(--border);
            border-radius: 6px;
            padding: 3px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            position: relative;
            min-height: 60px;
        }
        .class-block {
            flex: 1;
            border-radius: 5px;
            padding: 4px 6px;
            color: #fff;
            font-size: 0.7rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            position: relative;
            cursor: default;
        }
        .class-block-name { font-weight: 600; line-height: 1.3; margin-bottom: 1px; }
        .class-block-prof { opacity: 0.8; font-size: 0.62rem; }
        .class-block-loc  { opacity: 0.7; font-size: 0.58rem; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .class-block.conflict {
            background: var(--danger) !important;
            animation: pulse 2s infinite;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .remove-btn {
            position: absolute; top: 3px; left: 3px;
            width: 16px; height: 16px;
            background: rgba(0,0,0,0.35);
            color: #fff; border-radius: 50%;
            display: none; align-items: center; justify-content: center;
            cursor: pointer; font-size: 11px; line-height: 1; z-index: 5;
            transition: background 0.15s;
        }
        .remove-btn:hover { background: var(--danger); }
        .class-block:hover .remove-btn { display: flex; }

        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.65; } }

        /* ===== EXAM MODAL ===== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(4px);
        }
        .modal {
            background: var(--bg-card); width: 90%; max-width: 620px;
            border-radius: 16px; padding: 24px; color: var(--text-main);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-title { font-size: 1.1rem; font-weight: 700; }
        .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; padding: 0 4px; line-height: 1; }
        .modal-close:hover { color: var(--text-main); }
        .exam-table { width: 100%; border-collapse: collapse; }
        .exam-table th { padding: 8px 12px; text-align: right; color: var(--text-muted); font-size: 0.8rem; font-weight: 600; border-bottom: 1px solid var(--border); }
        .exam-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        .exam-conflict td { color: var(--danger); font-weight: 600; background: var(--danger-dim); }

        /* ===== PRINT STYLES ===== */
        @media print {
            aside, .actions, .remove-btn, .modal-overlay { display: none !important; }
            body { overflow: visible; height: auto; }
            main { padding: 0; overflow: visible; }
            .timetable-container { border: none; padding: 0; overflow: visible; }
            .timetable { min-height: auto; height: auto; }
            .class-block { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }

        /* ===== EMPTY STATE ===== */
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); gap: 10px; text-align: center; padding: 20px; }
        .empty-icon { font-size: 2.5rem; opacity: 0.4; }
        .empty-text { font-size: 0.85rem; }

        /* ===== TOOLTIP LEGEND ===== */
        .legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 8px;
        }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    </style>
</head>
<body>

<!-- ===== SIDEBAR ===== -->
<aside>
    <div class="sidebar-header">
        <div class="sidebar-header-top">
            <span class="sidebar-title">📚 انتخاب واحد</span>
            <div class="unit-badge" id="unitBadge">
                <span id="unitCount">۰</span>
                <span>واحد</span>
            </div>
        </div>
        <div class="tab-bar">
            <button class="tab-btn active" id="tabBtnSearch" onclick="switchTab('search')">🔎 جستجوی درس</button>
            <button class="tab-btn" id="tabBtnCurriculum" onclick="switchTab('curriculum')">🗺️ نقشه درسی</button>
        </div>
    </div>

    <!-- TAB: جستجو -->
    <div class="tab-content active" id="tabSearch">
        <div class="filter-container">
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="نام درس، استاد، کد...">
            </div>
            <div class="filter-row">
                <select id="facultyFilter"><option value="">همه دانشکده‌ها</option></select>
                <select id="groupFilter"><option value="">همه گروه‌ها</option></select>
            </div>
            <select id="genderFilter">
                <option value="">همه جنسیت‌ها</option>
                <option value="مختلط">مختلط</option>
                <option value="مرد">برادران</option>
                <option value="زن">خواهران</option>
            </select>
        </div>
        <div class="course-list">
            <div class="list-header">
                <span class="list-count" id="stats"></span>
            </div>
            <div id="courseList"></div>
        </div>
    </div>

    <!-- TAB: نقشه درسی -->
    <div class="tab-content" id="tabCurriculum">
        <div class="curriculum-controls" id="curriculumControls" style="display:none;">
            <label>ورودی:</label>
            <select id="cohortSelect" onchange="onCohortChange()">
            </select>
        </div>
        <div class="curriculum-scroll" id="curriculumScroll">
            <div class="empty-state">
                <div class="empty-icon">🗺️</div>
                <div class="empty-text">از تب «جستجوی درس» یک دانشکده و گروه انتخاب کنید.</div>
            </div>
        </div>
    </div>
</aside>

<!-- ===== MAIN ===== -->
<main>
    <div class="main-header">
        <div class="main-header-left">
            <h1 class="main-title">برنامه هفتگی</h1>
            <span class="selected-count-header" id="selectedCountHeader">هیچ درسی انتخاب نشده</span>
        </div>
        <div class="actions">
            <button class="btn btn-theme" id="themeBtn" onclick="toggleTheme()">🌗 تم</button>
            <button class="btn btn-print" onclick="window.print()">🖨️ چاپ</button>
            <button class="btn btn-exam" onclick="openExamModal()">📅 امتحانات</button>
            <a href="professor.html" class="btn btn-prof" style="text-decoration:none">👨‍🏫 داشبورد استاد</a>
            <a href="admin.html" class="btn btn-outline" style="text-decoration:none;font-size:0.75rem;">⚙️ ادمین</a>
        </div>
    </div>

    <div style="margin-bottom: 10px;">
        <div class="legend" id="facultyLegend"></div>
    </div>

    <div class="timetable-container">
        <div class="timetable" id="timetable"></div>
    </div>
</main>

<!-- ===== EXAM MODAL ===== -->
<div class="modal-overlay" id="examModal" onclick="if(event.target===this)closeExamModal()">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title">📅 برنامه امتحانات</h3>
            <button class="modal-close" onclick="closeExamModal()">&times;</button>
        </div>
        <table class="exam-table">
            <thead><tr><th>نام درس</th><th>تاریخ</th><th>ساعت</th></tr></thead>
            <tbody id="examBody"></tbody>
        </table>
    </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/curriculum_cs.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
