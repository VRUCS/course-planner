<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انتخاب واحد هوشمند</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"/>
<link rel="stylesheet" href="assets/css/main.css">
<style>
/* ── Layout ──────────────────────────────────────────────────────────────── */
body   { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.app   { display: flex; flex: 1; min-height: 0; overflow: hidden; }

/* ── Top bar ─────────────────────────────────────────────────────────────── */
.app-topbar {
  background: var(--s0); border-bottom: 1px solid var(--b0);
  padding: 0 20px; height: 54px; display: flex;
  align-items: center; justify-content: space-between; gap: 16px;
  flex-shrink: 0;
}
.brand {
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;
}
.brand-logo {
  width: 32px; height: 32px; border-radius: var(--r1);
  background: linear-gradient(135deg, var(--blue), var(--violet));
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; flex-shrink: 0;
}
.brand-name  { font-size: 0.92rem; font-weight: 800; }
.brand-badge { font-size: 0.62rem; background: var(--blue-dim); color: var(--blue); border: 1px solid rgba(59,130,246,0.25); border-radius: 4px; padding: 1px 6px; font-weight: 700; }
.topbar-center { flex: 1; display: flex; justify-content: center; }
.unit-display {
  display: flex; align-items: center; gap: 10px;
  background: var(--s1); border: 1px solid var(--b0);
  border-radius: var(--r4); padding: 5px 16px 5px 10px;
  font-size: 0.8rem;
}
.unit-count { font-size: 1rem; font-weight: 800; }
.unit-sep   { color: var(--b2); }
.unit-max   { color: var(--t2); font-weight: 600; }
.unit-bar   { width: 60px; height: 4px; background: var(--b0); border-radius: 2px; overflow: hidden; }
.unit-bar-fill { height: 100%; border-radius: 2px; background: var(--blue); transition: width var(--slow), background var(--mid); }
.topbar-actions { display: flex; gap: 6px; align-items: center; }

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
.sidebar {
  width: 370px; min-width: 370px;
  background: var(--s1); border-left: 1px solid var(--b0);
  display: flex; flex-direction: column; z-index: 10; min-height: 0;
}
.sidebar-tabs  { padding: 12px 14px 10px; border-bottom: 1px solid var(--b0); flex-shrink: 0; }
.sidebar-body  { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }

/* Search tab */
.search-filters {
  padding: 12px 14px 10px; border-bottom: 1px solid var(--b0);
  display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
}
.filter-row { display: flex; gap: 8px; }
.filter-row select { flex: 1; }

.course-list-header {
  padding: 8px 14px 4px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
}
.course-list-count { font-size: 0.72rem; color: var(--t3); }
.course-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 10px; }

/* Curriculum tab */
.cur-controls { padding: 12px 14px 10px; border-bottom: 1px solid var(--b0); flex-shrink: 0; }
.cur-controls label { font-size: 0.74rem; color: var(--t3); font-weight: 600; display: block; margin-bottom: 5px; }
.cur-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; }

/* ── Main ────────────────────────────────────────────────────────────────── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 16px 20px; gap: 12px; min-width: 0; min-height: 0; }
.main-header { display: flex; justify-content: space-between; align-items: center; }
.main-title  { font-size: 1.1rem; font-weight: 800; }
.main-subtitle { font-size: 0.78rem; color: var(--t3); margin-top: 2px; }

.timetable-container {
  flex: 1; min-height: 0; background: var(--s1); border: 1px solid var(--b0);
  border-radius: var(--r3); padding: 12px; overflow: auto;
}
.timetable-inner {
  display: grid;
  grid-template-columns: 54px repeat(5, 1fr);
  grid-template-rows: 40px repeat(5, 1fr);
  gap: 3px; min-width: 620px; height: 100%; min-height: 320px;
}
</style>
</head>
<body>

<!-- ── Top Bar ─────────────────────────────────────────────────────────────── -->
<header class="app-topbar no-print">
  <a href="#" class="brand" onclick="return false">
    <div class="brand-logo">📚</div>
    <div>
      <div class="brand-name">انتخاب واحد</div>
    </div>
    <span class="brand-badge hide-mobile">هوشمند</span>
  </a>

  <div class="topbar-center hide-mobile">
    <div class="unit-display" id="unitDisplay" title="واحدهای انتخاب‌شده">
      <div class="unit-bar"><div class="unit-bar-fill" id="unitBarFill" style="width:0%"></div></div>
      <span class="unit-count" id="unitCount">۰</span>
      <span class="unit-sep">/</span>
      <span class="unit-max">۲۰ واحد</span>
    </div>
  </div>

  <div class="topbar-actions">
    <button class="btn btn-ghost btn-sm" id="themeBtn" onclick="onToggleTheme()" title="تغییر تم">🌗</button>
    <button class="btn btn-ghost btn-sm" onclick="window.print()" title="چاپ برنامه">🖨️</button>
    <button class="btn btn-ghost btn-sm" style="background:rgba(245,158,11,.15);color:var(--yellow);border-color:rgba(245,158,11,.3)" onclick="openExamModal()">📅 امتحانات</button>
    <a href="professor.html" class="btn btn-ghost btn-sm" style="background:var(--violet-dim);color:var(--violet);border-color:rgba(139,92,246,.3);text-decoration:none">👨‍🏫 استاد</a>
    <a href="admin.html" class="btn btn-ghost btn-sm" style="text-decoration:none">⚙️</a>
  </div>
</header>

<!-- ── App Body ────────────────────────────────────────────────────────────── -->
<div class="app">

  <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
  <aside class="sidebar no-print">
    <div class="sidebar-tabs">
      <div class="tabs">
        <button class="tab-btn active" id="tabBtnSearch" onclick="switchTab('search')">🔍 جستجوی درس</button>
        <button class="tab-btn" id="tabBtnCurriculum" onclick="switchTab('curriculum')">🗺️ نقشه درسی</button>
      </div>
    </div>

    <div class="sidebar-body">

      <!-- Tab: Search -->
      <div class="tab-panel active" id="tabSearch" style="flex-direction:column">
        <div class="search-filters">
          <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="جستجو در نام درس، استاد، کد...">
            <span class="search-icon">🔍</span>
          </div>
          <div class="filter-row">
            <select id="facultyFilter"><option value="">همه دانشکده‌ها</option></select>
            <select id="groupFilter"><option value="">همه گروه‌ها</option></select>
          </div>
          <select id="genderFilter">
            <option value="">همه جنسیت‌ها</option>
            <option value="مختلط">مختلط</option>
            <option value="مرد">برادران</option>
            <option value="زن">خواهران</option>
          </select>
        </div>
        <div class="course-list-header">
          <span class="course-list-count" id="courseCount">...</span>
          <span style="font-size:.7rem;color:var(--t3)" id="selectedStat"></span>
        </div>
        <div class="course-list" id="courseList"></div>
      </div>

      <!-- Tab: Curriculum -->
      <div class="tab-panel" id="tabCurriculum" style="flex-direction:column">
        <div class="cur-controls" id="curriculumControls" style="display:none">
          <label>ورودی:</label>
          <select id="cohortSelect" onchange="onCohortChange()"></select>
        </div>
        <div class="cur-scroll" id="curriculumScroll">
          <div class="empty-state">
            <div class="empty-state-icon">🗺️</div>
            <div class="empty-state-title">نقشه درسی</div>
            <div class="empty-state-desc">از تب جستجو، یک دانشکده و گروه آموزشی انتخاب کنید.</div>
          </div>
        </div>
      </div>

    </div>
  </aside>

  <!-- ── Main ────────────────────────────────────────────────────────────── -->
  <main class="main">
    <div class="main-header">
      <div>
        <h1 class="main-title">برنامه هفتگی</h1>
        <div id="selectedInfo" class="main-subtitle" style="display:none"></div>
      </div>
      <div id="facultyLegend" class="faculty-legend"></div>
    </div>

    <div class="timetable-container">
      <div class="timetable-inner" id="timetable"></div>
    </div>
  </main>

</div>

<!-- ── Import file input ───────────────────────────────────────────────────── -->
<input type="file" id="importFileInput" accept=".json" style="display:none" onchange="importGolestanFile(this)">

<!-- ── Exam Modal ─────────────────────────────────────────────────────────── -->
<div class="modal-backdrop" id="examModal" onclick="if(event.target===this)closeExamModal()">
  <div class="modal-box anim-scale">
    <div class="modal-header">
      <h3 class="modal-title">📅 برنامه امتحانات</h3>
      <button class="modal-close" onclick="closeExamModal()">×</button>
    </div>
    <div class="modal-body">
      <table class="data-table">
        <thead><tr><th>نام درس</th><th>تاریخ</th><th>ساعت</th></tr></thead>
        <tbody id="examBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ── Scripts ─────────────────────────────────────────────────────────────── -->
<script src="assets/js/data.js"></script>
<script src="assets/js/curriculum_cs.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
