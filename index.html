<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انتخاب واحد هوشمند</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"/>
<link rel="stylesheet" href="assets/css/main.css">
<style>
/* ── Layout ──────────────────────────────────────────────────────────────── */
body   { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.app   { display: flex; flex: 1; min-height: 0; overflow: hidden; }

/* ── Top bar ─────────────────────────────────────────────────────────────── */
.app-topbar {
  background: var(--s0); border-bottom: 1px solid var(--b0);
  padding: 0 20px; height: 54px; display: flex;
  align-items: center; justify-content: space-between; gap: 16px;
  flex-shrink: 0;
}
.brand {
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;
}
.brand-logo {
  width: 32px; height: 32px; border-radius: var(--r1);
  background: linear-gradient(135deg, var(--blue), var(--violet));
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; flex-shrink: 0;
}
.brand-name  { font-size: 0.92rem; font-weight: 800; }
.brand-badge { font-size: 0.62rem; background: var(--blue-dim); color: var(--blue); border: 1px solid rgba(59,130,246,0.25); border-radius: 4px; padding: 1px 6px; font-weight: 700; }
.topbar-center { flex: 1; display: flex; justify-content: center; }
.unit-display {
  display: flex; align-items: center; gap: 10px;
  background: var(--s1); border: 1px solid var(--b0);
  border-radius: var(--r4); padding: 5px 16px 5px 10px;
  font-size: 0.8rem;
}
.unit-count { font-size: 1rem; font-weight: 800; }
.unit-sep   { color: var(--b2); }
.unit-max   { color: var(--t2); font-weight: 600; }
.unit-bar   { width: 60px; height: 4px; background: var(--b0); border-radius: 2px; overflow: hidden; }
.unit-bar-fill { height: 100%; border-radius: 2px; background: var(--blue); transition: width var(--slow), background var(--mid); }
.topbar-actions { display: flex; gap: 6px; align-items: center; }

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
.sidebar {
  width: 370px; min-width: 370px;
  background: var(--s1); border-left: 1px solid var(--b0);
  display: flex; flex-direction: column; z-index: 10; min-height: 0;
}
.sidebar-tabs  { padding: 12px 14px 10px; border-bottom: 1px solid var(--b0); flex-shrink: 0; }
.sidebar-body  { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }

/* Search tab */
.search-filters {
  padding: 12px 14px 10px; border-bottom: 1px solid var(--b0);
  display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
}
.filter-row { display: flex; gap: 8px; }
.filter-row select { flex: 1; }

.course-list-header {
  padding: 8px 14px 4px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
}
.course-list-count { font-size: 0.72rem; color: var(--t3); }
.course-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 10px; }

/* Curriculum tab */
.cur-controls { padding: 12px 14px 10px; border-bottom: 1px solid var(--b0); flex-shrink: 0; }
.cur-controls label { font-size: 0.74rem; color: var(--t3); font-weight: 600; display: block; margin-bottom: 5px; }
.cur-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; }

/* ── Main ────────────────────────────────────────────────────────────────── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 16px 20px; gap: 12px; min-width: 0; min-height: 0; }
.main-header { display: flex; justify-content: space-between; align-items: center; }
.main-title  { font-size: 1.1rem; font-weight: 800; }
.main-subtitle { font-size: 0.78rem; color: var(--t3); margin-top: 2px; }

.timetable-container {
  flex: 1; min-height: 0; background: var(--s1); border: 1px solid var(--b0);
  border-radius: var(--r3); padding: 12px; overflow: auto;
}
.timetable-inner {
  display: grid;
  grid-template-columns: 54px repeat(5, 1fr);
  grid-template-rows: 40px repeat(5, 1fr);
  gap: 3px; min-width: 620px; height: 100%; min-height: 320px;
}

/* ══════════════════════════════════════════════════════════
   MOBILE — bottom‑nav layout (≤ 768px)
   ══════════════════════════════════════════════════════════ */
.mob-nav        { display: none; }
.mob-unit-pill  { display: none; }

@media (max-width: 768px) {
  /* Body stays 100vh, no body scroll */
  body { height: 100dvh; overflow: hidden; }

  /* .app becomes a grid — sidebar + main share the same cell, overlapping */
  .app {
    display: grid;
    grid-template-areas: 'view';
    grid-template-rows: 1fr;
    grid-template-columns: 1fr;
    overflow: hidden;
  }

  /* Both panels occupy the same grid cell → full-height guaranteed */
  .sidebar, .main {
    grid-area: view;
    width: 100% !important; min-width: unset !important;
    border: none !important;
    transition: transform .28s cubic-bezier(.4,0,.2,1),
                opacity    .2s ease;
    will-change: transform, opacity;
    overflow: hidden;
  }

  /* ── View: search (default) ── */
  body[data-mob="search"]     .sidebar { transform: translateX(0);    opacity: 1; pointer-events: auto; }
  body[data-mob="search"]     .main    { transform: translateX(-110%);opacity: 0; pointer-events: none; }

  /* ── View: schedule ── */
  body[data-mob="schedule"]   .sidebar { transform: translateX(110%); opacity: 0; pointer-events: none; }
  body[data-mob="schedule"]   .main    { transform: translateX(0);    opacity: 1; pointer-events: auto; }

  /* ── View: curriculum ── */
  body[data-mob="curriculum"] .sidebar { transform: translateX(0);    opacity: 1; pointer-events: auto; }
  body[data-mob="curriculum"] .main    { transform: translateX(-110%);opacity: 0; pointer-events: none; }

  /* ارتفاع sidebar و main مستقیماً محاسبه می‌شود: کل صفحه منهای topbar و mob-nav */
  .sidebar, .main {
    height: calc(100dvh - 50px - 62px) !important;
    overflow: hidden !important;
  }

  /* Hide desktop sidebar tab‑bar (we navigate via bottom nav) */
  .sidebar-tabs { display: none; }

  /* Mobile schedule header */
  .mob-sched-header {
    padding: 12px 16px 8px; flex-shrink: 0;
    display: flex !important; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--b0);
  }
  .mob-sched-title { font-size: .95rem; font-weight: 800; }

  /* Main fills properly on mobile */
  .main { padding: 0; gap: 0; background: var(--s1); }
  .timetable-container { border-radius: 0; border: none; border-top: 1px solid var(--b0); flex: 1; min-height: 0; padding: 10px; }

  /* Larger touch targets in course cards */
  .course-card { padding: 14px 14px 10px; }
  .course-card-name { font-size: .95rem; }

  /* Timetable slot: taller on mobile */
  .timetable-inner { min-height: 360px; }
  .slot { min-height: 68px; }

  /* Main header compact */
  .main-header  { display: none; }   /* hidden — title replaced by bottom‑nav label */
  .faculty-legend { display: none; }

  /* ── Topbar: compact ── */
  .app-topbar {
    height: 50px; padding: 0 14px; gap: 10px;
  }
  .topbar-center, .brand-badge { display: none; }
  .topbar-actions .btn { padding: 6px 10px; font-size: .76rem; }
  /* hide print / admin / professor on mobile — accessible via menu */
  .topbar-actions .btn:not(#themeBtn):not(.mob-exam-btn) { display: none; }

  /* mobile unit pill inside topbar */
  .mob-unit-pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--blue-dim); border: 1px solid rgba(59,130,246,.3);
    border-radius: 20px; padding: 4px 12px 4px 8px;
    font-size: .78rem; font-weight: 700; color: var(--blue);
  }
  .mob-unit-pill.over { background: var(--red-dim); border-color: rgba(239,68,68,.4); color: var(--red); }
  .mob-unit-num { font-size: .95rem; font-weight: 800; }

  /* ── Bottom Navigation ── */
  .mob-nav {
    display: flex; flex-shrink: 0;
    height: 62px;
    background: var(--s1);
    border-top: 1px solid var(--b0);
    safe-area-inset-bottom: env(safe-area-inset-bottom);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .mob-nav-btn {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
    border: none; background: transparent; cursor: pointer;
    color: var(--t3); font-family: inherit; font-size: .65rem; font-weight: 600;
    transition: color .15s, background .15s;
    position: relative; padding: 6px 4px;
    -webkit-tap-highlight-color: transparent;
  }
  .mob-nav-btn:active { background: var(--b0); }
  .mob-nav-icon { font-size: 1.35rem; line-height: 1; }
  .mob-nav-btn.active { color: var(--blue); }
  .mob-nav-btn.active .mob-nav-icon-wrap {
    background: var(--blue-dim); border-radius: 12px;
    padding: 4px 18px; margin-bottom: 1px;
  }

  /* badge for schedule button */
  .mob-nav-badge {
    position: absolute; top: 6px; right: calc(50% - 22px);
    background: var(--blue); color: #fff;
    border-radius: 10px; font-size: .6rem; font-weight: 800;
    padding: 1px 5px; min-width: 16px; text-align: center;
    border: 2px solid var(--s1);
  }

  /* cur‑scroll bottom padding so last card isn't behind nav */
  .cur-scroll  { padding-bottom: 16px; }
  .course-list { padding-bottom: 16px; }
}

/* iPhone safe area (notch) */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  @media (max-width: 768px) {
    .mob-nav { padding-bottom: env(safe-area-inset-bottom); height: calc(62px + env(safe-area-inset-bottom)); }
  }
}
</style>
</head>
<body>

<!-- ── Top Bar ─────────────────────────────────────────────────────────────── -->
<header class="app-topbar no-print">
  <a href="#" class="brand" onclick="return false">
    <div class="brand-logo">📚</div>
    <div>
      <div class="brand-name">انتخاب واحد</div>
    </div>
    <span class="brand-badge hide-mobile">هوشمند</span>
  </a>

  <div class="topbar-center hide-mobile">
    <div class="unit-display" id="unitDisplay" title="واحدهای انتخاب‌شده">
      <div class="unit-bar"><div class="unit-bar-fill" id="unitBarFill" style="width:0%"></div></div>
      <span class="unit-count" id="unitCount">۰</span>
      <span class="unit-sep">/</span>
      <span class="unit-max">۲۰ واحد</span>
    </div>
  </div>

  <!-- unit pill فقط روی موبایل نمایش داده می‌شود -->
  <div class="mob-unit-pill" id="mobUnitPill">
    <span class="mob-unit-num" id="mobUnitNum">۰</span>
    <span style="color:var(--t3);font-weight:500">/ ۲۰ واحد</span>
  </div>

  <div class="topbar-actions">
    <button class="btn btn-ghost btn-sm" id="themeBtn" onclick="onToggleTheme()" title="تغییر تم">🌗</button>
    <button class="btn btn-ghost btn-sm mob-exam-btn" style="background:rgba(245,158,11,.15);color:var(--yellow);border-color:rgba(245,158,11,.3)" onclick="openExamModal()">📅 امتحانات</button>
    <button class="btn btn-ghost btn-sm" onclick="window.print()" title="چاپ">🖨️</button>
    <a href="professor.html" class="btn btn-ghost btn-sm" style="background:var(--violet-dim);color:var(--violet);border-color:rgba(139,92,246,.3);text-decoration:none">👨‍🏫 استاد</a>
    <a href="admin.html" class="btn btn-ghost btn-sm" style="text-decoration:none">⚙️</a>
  </div>
</header>

<!-- ── App Body ────────────────────────────────────────────────────────────── -->
<div class="app">

  <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
  <aside class="sidebar no-print">
    <div class="sidebar-tabs">
      <div class="tabs">
        <button class="tab-btn active" id="tabBtnSearch" onclick="switchTab('search')">🔍 جستجوی درس</button>
        <button class="tab-btn" id="tabBtnCurriculum" onclick="switchTab('curriculum')">🗺️ نقشه درسی</button>
      </div>
    </div>

    <div class="sidebar-body">

      <!-- Tab: Search -->
      <div class="tab-panel active" id="tabSearch" style="flex-direction:column">
        <div class="search-filters">
          <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="جستجو در نام درس، استاد، کد...">
            <span class="search-icon">🔍</span>
          </div>
          <div class="filter-row">
            <select id="facultyFilter"><option value="">همه دانشکده‌ها</option></select>
            <select id="groupFilter"><option value="">همه گروه‌ها</option></select>
          </div>
        </div>
        <div class="course-list-header">
          <span class="course-list-count" id="courseCount">...</span>
          <span style="font-size:.7rem;color:var(--t3)" id="selectedStat"></span>
        </div>
        <div class="course-list" id="courseList"></div>
      </div>

      <!-- Tab: Curriculum -->
      <div class="tab-panel" id="tabCurriculum" style="flex-direction:column">
        <div class="cur-controls" id="curriculumControls" style="display:none">
          <label>ورودی:</label>
          <select id="cohortSelect" onchange="onCohortChange()"></select>
        </div>
        <div class="cur-scroll" id="curriculumScroll">
          <div class="empty-state">
            <div class="empty-state-icon">🗺️</div>
            <div class="empty-state-title">نقشه درسی</div>
            <div class="empty-state-desc">از تب جستجو، یک دانشکده و گروه آموزشی انتخاب کنید.</div>
          </div>
        </div>
      </div>

    </div>
  </aside>

  <!-- ── Main ────────────────────────────────────────────────────────────── -->
  <main class="main">
    <!-- Desktop header -->
    <div class="main-header">
      <div>
        <h1 class="main-title">برنامه هفتگی</h1>
        <div id="selectedInfo" class="main-subtitle" style="display:none"></div>
      </div>
      <div id="facultyLegend" class="faculty-legend"></div>
    </div>

    <!-- Mobile header (only shown on mobile) -->
    <div class="mob-sched-header" style="display:none" id="mobSchedHeader">
      <span class="mob-sched-title">📅 برنامه هفتگی</span>
      <span id="mobSelectedInfo" style="font-size:.75rem;color:var(--t3)"></span>
    </div>

    <div class="timetable-container">
      <div class="timetable-inner" id="timetable"></div>
    </div>
  </main>

</div>

<!-- ── Mobile bottom nav ──────────────────────────────────────────────────── -->
<nav class="mob-nav no-print" role="tablist">
  <button class="mob-nav-btn active" id="mnSearch" onclick="setMobView('search')" aria-label="جستجوی درس">
    <div class="mob-nav-icon-wrap">
      <span class="mob-nav-icon">🔍</span>
    </div>
    <span>جستجو</span>
  </button>
  <button class="mob-nav-btn" id="mnSchedule" onclick="setMobView('schedule')" aria-label="برنامه هفتگی">
    <div class="mob-nav-icon-wrap" style="position:relative">
      <span class="mob-nav-icon">📅</span>
      <span class="mob-nav-badge" id="mobBadge" style="display:none"></span>
    </div>
    <span>برنامه</span>
  </button>
  <button class="mob-nav-btn" id="mnCurriculum" onclick="setMobView('curriculum')" aria-label="نقشه درسی">
    <div class="mob-nav-icon-wrap">
      <span class="mob-nav-icon">🗺️</span>
    </div>
    <span>نقشه</span>
  </button>
</nav>

<!-- ── Import file input ───────────────────────────────────────────────────── -->
<input type="file" id="importFileInput" accept=".json" style="display:none" onchange="importGolestanFile(this)">

<!-- ── Exam Modal ─────────────────────────────────────────────────────────── -->
<div class="modal-backdrop" id="examModal" onclick="if(event.target===this)closeExamModal()">
  <div class="modal-box anim-scale">
    <div class="modal-header">
      <h3 class="modal-title">📅 برنامه امتحانات</h3>
      <button class="modal-close" onclick="closeExamModal()">×</button>
    </div>
    <div class="modal-body">
      <table class="data-table">
        <thead><tr><th>نام درس</th><th>تاریخ</th><th>ساعت</th></tr></thead>
        <tbody id="examBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- ── Scripts ─────────────────────────────────────────────────────────────── -->
<script src="assets/js/data.js"></script>
<script src="assets/js/curriculum_cs.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
